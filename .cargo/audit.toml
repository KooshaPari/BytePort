# cargo-audit ignore list.
#
# Every entry below is a vulnerability or warning that CANNOT currently be
# resolved by upgrading (no compatible fixed version is resolvable through
# the existing dependency graph, or the crate is an unmaintained-but-unused
# transitive leaf). Each entry cites the advisory and the reason it is safe
# to ignore as of 2026-07-03. Do not add entries here without a citation.

[advisories]
ignore = [
    # --- Real vulnerabilities: no resolvable fixed version yet ---
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml <0.41.0 quadratic
    # runtime / unbounded namespace allocation. quick-xml is pulled in
    # transitively via plist -> tauri (macOS Info.plist / bundle metadata
    # parsing at build/bundle time, not on any attacker-reachable runtime
    # path). Upstream `plist` v1.9.0 (latest release) still pins
    # `quick-xml = "^0.39.2"`, so no combination of `cargo update` can reach
    # the fixed 0.41.0 line without plist publishing a new release. Bumped
    # plist 1.7.4 -> 1.9.0 / quick-xml 0.38.4 -> 0.39.4 (closest available)
    # in this change; re-evaluate for a further bump once plist relaxes its
    # quick-xml constraint upstream.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- Unmaintained warnings: gtk-rs GTK3 bindings, dev/optional-only ---
    # RUSTSEC-2024-0411..0420: the gtk-rs 0.18 GTK3 binding crates
    # (atk, atk-sys, gdk, gdk-sys, gdkwayland-sys, gdkx11, gdkx11-sys,
    # gtk, gtk-sys, gtk3-macros) are flagged unmaintained upstream (gtk-rs
    # moved to gtk4). They arrive transitively via a Tauri Linux-only
    # bundling/tray dependency chain; no fixed/maintained GTK3 binding
    # exists to move to short of a GTK4 migration, which is out of scope
    # for a dependency-audit fix. Tracked for future Tauri/GTK4 upgrade.
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0419",

    # RUSTSEC-2024-0370: proc-macro-error is unmaintained. Build-time
    # proc-macro dependency only (no runtime exposure); no maintained
    # drop-in replacement is pulled by our direct deps' current versions.
    "RUSTSEC-2024-0370",

    # RUSTSEC-2025-0081 / 0075 / 0080 / 0100 / 0098: unic-char-property,
    # unic-char-range, unic-common, unic-ucd-ident, unic-ucd-version are
    # unmaintained (unic-* Unicode crates). Transitive text-processing
    # dependency; no maintained fixed version exists upstream yet.
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0098",

    # RUSTSEC-2026-0190: anyhow 1.0.102 Error::downcast_mut() unsoundness.
    # No fixed anyhow release exists yet upstream as of 2026-07-03; anyhow
    # is used for internal error handling only (not exposed to untrusted
    # downcasts across a trust boundary in this codebase).
    "RUSTSEC-2026-0190",

    # RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter Iterator/
    # DoubleEndedIterator unsoundness. Transitive via the same Tauri
    # GTK3-bindings chain as the gtk-rs entries above; no fixed glib 0.18.x
    # release exists and moving to glib 0.19+ requires the same GTK4
    # migration noted above.
    "RUSTSEC-2024-0429",
]
