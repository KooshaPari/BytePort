---
name: a11y-audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/web/src/**'
      - 'frontend/web/package.json'
      - 'tests/a11y/**'
  workflow_dispatch:
concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: WCAG-AA axe-core audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install deps
        working-directory: frontend/web
        run: npm ci --ignore-scripts

      - name: Build preview
        working-directory: frontend/web
        run: npm run build

      - name: Serve preview in background
        working-directory: frontend/web
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 1
            curl -fs http://127.0.0.1:4173/ > /dev/null && break
          done

      - name: Install axe-core runner
        working-directory: frontend/web
        run: |
          npm install --ignore-scripts --no-save --package-lock=false @axe-core/playwright@4.12.1 playwright@1.61.1
          npm exec --no -- playwright install --with-deps chromium

      - name: Run a11y audit
        env:
          A11Y_URLS: 'http://localhost:4173/,http://localhost:4173/login,http://localhost:4173/signup,http://localhost:4173/home,http://localhost:4173/m/deploys,http://localhost:4173/m/projects,http://localhost:4173/m/settings'
        working-directory: frontend/web
        run: node --import tsx/esm ../../tests/a11y/audit.ts

      - name: Annotate PR (failure only)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Accessibility audit — WCAG-AA gate FAIL',
                '',
                'Axe-core detected **critical or serious** WCAG 2.1 AA violations.',
                '',
                '### Remediation playbook',
                '1. Run locally: `cd frontend/web && npm run a11y:audit` (requires the preview server running on :4173)',
                '2. Each violation links to its WCAG rule — click into `helpUrl` for fix guidance',
                '3. Common BytePort failures + fixes:',
                '   - Missing form labels → add `<label for>` or wrap input + use aria-describedby for help text',
                '   - Color contrast < 4.5:1 → use `bg-primary` tokens, avoid raw hex codes',
                '   - Buttons without accessible name → add `aria-label`, never use only an SVG icon',
                '   - Landmarks missing → wrap content in `<main>` / `<nav>` / `<aside>`; m/+layout.svelte is the canonical example',
                '   - Focus order broken → add `tabindex="0"` only when restructuring DOM order is impossible',
                '4. Re-run the workflow to re-verify.',
                '',
                'See `tests/a11y/audit.ts` to extend the audit (currently 7 routes).'
              ].join('\n')
            });
