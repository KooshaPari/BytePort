name: Benchmarks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench-output.txt
      - name: Check for regressions
        run: |
          if grep -qE "Performance has (regressed|degraded)" bench-output.txt 2>/dev/null; then
            echo "::warning::Benchmark regression detected — check criterion report"
          fi
