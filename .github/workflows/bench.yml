name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Run criterion benchmarks
        run: |
          mkdir -p benchmark-results
          cargo bench -- --output-format bencher | tee benchmark-results/criterion.txt
        continue-on-error: true

      - name: Save criterion HTML report
        if: hashFiles('target/criterion') != ''
        run: |
          cp -r target/criterion benchmark-results/criterion-html || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: byteport-benchmark-results-${{ github.sha }}
          path: benchmark-results/
          retention-days: 30

  compare-baseline:
    name: Compare with main baseline
    runs-on: ubuntu-latest
    needs: bench
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      - name: Run baseline benchmarks (main)
        run: |
          git fetch origin main
          git stash
          git checkout origin/main
          mkdir -p baseline-results
          cargo bench -- --output-format bencher | tee baseline-results/criterion.txt || true
          git checkout -
          git stash pop || true

      - name: Download PR benchmarks
        uses: actions/download-artifact@v4
        with:
          name: byteport-benchmark-results-${{ github.sha }}
          path: current-results/

      - name: Compare results
        run: |
          echo "=== Benchmark Comparison ==="
          echo ""
          echo "Main branch results:"
          cat baseline-results/criterion.txt || echo "No baseline results"
          echo ""
          echo "PR branch results:"
          cat current-results/criterion.txt || echo "No PR results"
          echo ""

          # Simple regression check: fail if any benchmark got >20% slower
          if [ -f baseline-results/criterion.txt ] && [ -f current-results/criterion.txt ]; then
            python3 -c "
          import re, sys

          def parse_benchmarks(path):
              results = {}
              try:
                  with open(path) as f:
                      for line in f:
                          m = re.match(r'(\S+)\s+(\d+)\s*(ns|\u00b5s|ms|s)', line.strip())
                          if m:
                              name = m.group(1)
                              val = int(m.group(2))
                              unit = m.group(3)
                              multipliers = {'ns': 1, '\u00b5s': 1000, 'ms': 1000000, 's': 1000000000}
                              results[name] = val * multipliers[unit]
              except Exception as e:
                  print(f'Warning: could not parse {path}: {e}')
              return results

          baseline = parse_benchmarks('baseline-results/criterion.txt')
          current = parse_benchmarks('current-results/criterion.txt')

          if not baseline or not current:
              print('Could not parse benchmark results for comparison.')
              sys.exit(0)

          regressions = []
          improvements = []
          for name in current:
              if name in baseline:
                  ratio = current[name] / baseline[name]
                  pct = (ratio - 1) * 100
                  if pct > 20:
                      regressions.append((name, pct))
                  elif pct < -20:
                      improvements.append((name, pct))

          if regressions:
              print()
              print('Performance regressions detected (>20% slower):')
              for name, pct in sorted(regressions, key=lambda x: -x[1]):
                  print(f'  {name}: +{pct:.1f}%')
              sys.exit(1)

          if improvements:
              print()
              print('Performance improvements detected:')
              for name, pct in sorted(improvements, key=lambda x: x[1]):
                  print(f'  {name}: {pct:.1f}%')

          print()
          print('No significant regressions detected.')
          "

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let body = '## Benchmark Results\n\n';
            try {
              const baseline = fs.readFileSync('baseline-results/criterion.txt', 'utf8');
              const current = fs.readFileSync('current-results/criterion.txt', 'utf8');
              body += '<details><summary>Main branch baseline</summary>\n\n```\n' + baseline + '\n```\n</details>\n\n';
              body += '<details><summary>PR branch results</summary>\n\n```\n' + current + '\n```\n</details>\n\n';
            } catch (e) {
              body += 'Benchmark artifacts available in the workflow run.\n';
            }
            body += `\n[View full results](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
