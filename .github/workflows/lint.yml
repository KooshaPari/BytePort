name: Lint
on: [push, pull_request]
jobs:
  golangci:
    name: Go lint (golangci)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.0'
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v6
        with:
          working-directory: backend

  clippy:
    name: Rust lint (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - name: Install Linux GTK/WebKit build dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
      - name: cargo clippy with complexity gates
        run: |
          cargo clippy --workspace --all-targets --locked -- \
            -D clippy::cognitive_complexity \
            -D clippy::too_many_arguments \
            -D clippy::too_many_lines \
            -W clippy::unwrap_used \
            -D warnings
