name: BytePort Mature Recovery Build Prototype

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/specs/mature-recovery/2026-09-29/fixtures/selected-app/**"
      - ".github/workflows/mature-recovery-build-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byteport-mature-recovery-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delegated-build-selected-app:
    name: Delegated build + selected app identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve exact source and manifest identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="docs/specs/mature-recovery/2026-09-29/fixtures/selected-app"
          MANIFEST_DIGEST="$(sha256sum "$FIXTURE/fixture.manifest.json" | awk '{print $1}')"
          echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Delegate build to Docker engine
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="docs/specs/mature-recovery/2026-09-29/fixtures/selected-app"
          docker build             --build-arg SOURCE_COMMIT="${{ steps.identity.outputs.source_commit }}"             --build-arg MANIFEST_DIGEST="${{ steps.identity.outputs.manifest_digest }}"             -t byteport-selected-app:recovery             "$FIXTURE"
          docker image inspect byteport-selected-app:recovery --format '{{.Id}}' > /tmp/artifact-id

      - name: Export portable image archive and digest
        shell: bash
        run: |
          set -euo pipefail
          docker image save byteport-selected-app:recovery -o /tmp/byteport-image.tar
          sha256sum /tmp/byteport-image.tar | awk '{print $1}' > /tmp/portable-artifact-digest
          docker buildx version > /tmp/builder-version

      - name: Generate and verify BuildKit SLSA provenance
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="docs/specs/mature-recovery/2026-09-29/fixtures/selected-app"
          rm -rf /tmp/byteport-provenance-out
          docker buildx create --name byteport-recovery-builder --driver docker-container --use
          trap 'docker buildx rm -f byteport-recovery-builder >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build --build-arg SOURCE_COMMIT="${{ steps.identity.outputs.source_commit }}" --build-arg MANIFEST_DIGEST="${{ steps.identity.outputs.manifest_digest }}" --attest type=provenance,mode=min,version=v1,filename=provenance.json --output type=local,dest=/tmp/byteport-provenance-out "$FIXTURE"
          test -s /tmp/byteport-provenance-out/provenance.json
          grep -q 'https://slsa.dev/provenance/v1' /tmp/byteport-provenance-out/provenance.json
          grep -q 'buildDefinition' /tmp/byteport-provenance-out/provenance.json
          grep -q 'runDetails' /tmp/byteport-provenance-out/provenance.json
          cp /tmp/byteport-provenance-out/provenance.json /tmp/byteport-provenance.json
          sha256sum /tmp/byteport-provenance.json | awk '{print $1}' > /tmp/provenance-digest
      - name: Run immutable built subject and observe application identity
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker run -d -p 127.0.0.1:18080:8080 byteport-selected-app:recovery)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/__byteport_probe -o /tmp/probe.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/probe.json
          test "$(jq -r .source_commit /tmp/probe.json)" = "${{ steps.identity.outputs.source_commit }}"
          test "$(jq -r .manifest_digest /tmp/probe.json)" = "${{ steps.identity.outputs.manifest_digest }}"

      - name: Emit evidence receipt
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(cat /tmp/artifact-id)"
          PORTABLE_DIGEST="$(cat /tmp/portable-artifact-digest)"
          BUILDER="$(head -n1 /tmp/builder-version)"
          PROVENANCE_DIGEST="$(cat /tmp/provenance-digest)"
          jq -n             --arg source_commit "${{ steps.identity.outputs.source_commit }}"             --arg manifest_digest "${{ steps.identity.outputs.manifest_digest }}"             --arg artifact_id "$ARTIFACT_ID"             --arg portable_digest "$PORTABLE_DIGEST"             --arg builder "$BUILDER"             --arg provenance_digest "$PROVENANCE_DIGEST"             --slurpfile probe /tmp/probe.json             '{
              classification:"ARCHITECTURE_PROTOTYPE_NOT_PRODUCT_ACCEPTANCE",
              source_snapshot:$source_commit,
              manifest_digest:$manifest_digest,
              build_engine:"docker",
              immutable_local_artifact_id:$artifact_id,
              portable_archive_sha256:$portable_digest,
              builder:$builder,
              provenance_status:"SLSA_V1_ATTESTATION_VERIFIED",
              provenance_sha256:$provenance_digest,
              live_probe:$probe[0]
            }' > /tmp/byteport-build-receipt.json
          cat /tmp/byteport-build-receipt.json

      - uses: actions/upload-artifact@v7
        with:
          name: byteport-mature-recovery-build-receipt
          path: |
            /tmp/byteport-build-receipt.json
            /tmp/byteport-provenance.json
          retention-days: 30
