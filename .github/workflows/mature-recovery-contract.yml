name: Mature Recovery Contract Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/specs/mature-recovery/**"
      - "scripts/recovery/**"
      - ".github/workflows/mature-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mature-recovery-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  work-packages:
    name: Validate work-package DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate
        run: python scripts/recovery/validate_work_packages.py docs/specs/mature-recovery/2026-09-29/work-packages.json

  evidence-fixture:
    name: Validate evidence receipt semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate non-green fixture
        run: python scripts/recovery/validate_evidence.py docs/specs/mature-recovery/2026-09-29/evidence/example-not-run.json

  a01-identities:
    name: BP-WP-A01 identity tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/byteport
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/byteport/go.mod
          cache-dependency-path: backend/byteport/go.sum
      - name: Test additive semantic identities
        run: go test ./models -run '^(TestMatureIdentity|TestComponentCanBeProviderManagedWithoutArtifact|TestRuntimeUnknownIsFirstClass|TestProviderResourceIdentityIsDistinctAtTypedBoundary)$' -count=1 -v

  a02-a03-contracts:
    name: BP-WP-A02-A03 additive contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/byteport
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/byteport/go.mod
          cache-dependency-path: backend/byteport/go.sum
      - name: Legacy-safe and application-contract tests
        run: go test ./models -run '^(TestLegacyImportDoesNotFabricateVerifiedIdentity|TestMatureIdentity|TestComponentCanBeProviderManagedWithoutArtifact|TestRuntimeUnknownIsFirstClass|TestProviderResourceIdentityIsDistinctAtTypedBoundary)$' -count=1 -v

  a04-a06-contracts:
    name: BP-WP-A04-A06 adapter and trace contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/byteport
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/byteport/go.mod
          cache-dependency-path: backend/byteport/go.sum
      - name: Test adapter capability semantics
        run: go test ./models -run '^(TestBuildEngineCapabilitiesAreNotBrandIdentity|TestRuntimeObservationCanRepresentVisibilityUncertainty)$' -count=1 -v
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate semantic trace fixture
        working-directory: .
        run: python scripts/recovery/validate_trace.py docs/specs/mature-recovery/2026-09-29/trace-slice.json
