# SLSA Build L3 — tag-triggered release attestation (companion to release-attestation.yml)
name: Release + SLSA Build Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.6.8)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Attest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@ffb18e4a4a47253c5f0bd7d526f2c6f1e7c5dd84 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47cdaad80c8cb6c652d2b0e2a8c73ad9a91ad7 # v2.7.7
        with:
          workspaces: |
            . -> target

      - name: Build artifact
        env:
          REPO_FULL: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          cargo build --release --locked --workspace --all-targets
          mkdir -p dist
          cat > target/release/BUILD_MANIFEST.txt <<EOF
          repository: ${REPO_FULL}
          ref:        ${REF}
          sha:        ${SHA}
          runner:     ${RUNNER_OS}
          built_at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          tar -czf dist/byteport-release.tar.gz \
            -C target/release \
            $(find target/release -maxdepth 1 -type f -executable) \
            BUILD_MANIFEST.txt
          ls -la dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@35a8f9717e7a2adb1c2c3b2ac88961ba9c230e98 # v1.3.0
        with:
          subject-name: dist/byteport-release.tar.gz
          subject-digest: sha256:$(sha256sum dist/byteport-release.tar.gz | awk '{print $1}')
          push-to-registry: false

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd0de8ccd5686b70862 # v4.6.0
        with:
          name: ${{ github.event.inputs.version || github.ref_name }}-artifact
          path: dist/
