# release-tauri.yml — Build and publish Tauri desktop installers
#
# Builds platform-specific installers on every tag push:
#   macOS:   .app, .dmg, .pkg
#   Windows: .msi, .nsis (.exe installer)
#   Linux:   .deb, .rpm, .AppImage
#
# Triggered by: tag push (v*), manual dispatch.

name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (aarch64 + x86_64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies (macOS)
        run: brew install lib[keys=webkitgtk-4.1,gtk4]

      - name: Install frontend deps
        working-directory: frontend/web
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app (universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend/web
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'BytePort ${{ github.ref_name || inputs.tag }}'
          releaseBody: 'See the assets below to download and install BytePort.'
          releaseDraft: false
          prerelease: false
          args: '--target universal-apple-darwin'

      - name: Build .pkg installer
        run: |
          PKG_PATH=$(find frontend/web/src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 2>/dev/null | head -1)
          if [ -n "$PKG_PATH" ]; then
            pkgbuild --component "$PKG_PATH" \
              --identifier com.byteport.desktop \
              --version "${{ github.ref_name || inputs.tag }}" \
              --install-location /Applications \
              BytePort-${{ github.ref_name || inputs.tag }}-universal.pkg
          fi

      - name: Upload .pkg to release
        uses: softprops/action-gh-release@v2
        with:
          files: BytePort-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows (x86_64 + aarch64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: frontend/web
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend/web
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'BytePort ${{ github.ref_name || inputs.tag }}'
          releaseBody: 'See the assets below to download and install BytePort.'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'

      - name: Upload .msi to release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux (x86_64 + aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-4-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libfuse2 rpm

      - name: Install frontend deps
        working-directory: frontend/web
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend/web
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'BytePort ${{ github.ref_name || inputs.tag }}'
          releaseBody: 'See the assets below to download and install BytePort.'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-unknown-linux-gnu'

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            frontend/web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            frontend/web/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-install-script:
    name: Update install script
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update install.sh with latest tag
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          sed -i "s|LATEST_VERSION=.*|LATEST_VERSION=\"$TAG\"|" install.sh

      - name: Commit updated install script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git diff --cached --quiet || git commit -m "chore: update install.sh to $TAG"
          git push
