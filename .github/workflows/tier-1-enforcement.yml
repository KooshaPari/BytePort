name: Tier-1 Enforcement (PR Gate)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Job 1: Security scan (cargo audit) ──────────────────────────────
  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: SBOM generation & validation ─────────────────────────────
  sbom-check:
    name: SBOM Generation & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.18.0
        with:
          path: .
          format: cyclonedx-json
          output-file: byteport-sbom.cdx.json
          upload-artifact: false

      - name: Validate SBOM output exists and is non-empty
        run: |
          sbom_file="byteport-sbom.cdx.json"
          if [ ! -s "$sbom_file" ]; then
            echo "❌ No non-empty byteport-sbom.cdx.json file found after generation"
            find . -type f -name '*.cdx.json' -print
            exit 1
          fi
          size=$(wc -c < "$sbom_file")
          if [ "$size" -lt 100 ]; then
            echo "❌ SBOM file suspiciously small ($size bytes)"
            exit 1
          fi
          echo "✅ SBOM is valid ($size bytes)"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-bomlet
          path: byteport-sbom.cdx.json
          retention-days: 60

  # ── Job 3: LICENSE presence & content check ─────────────────────────
  license-check:
    name: LICENSE Presence Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6

      - name: Verify LICENSE file exists
        run: |
          if [ -f LICENSE ]; then
            echo "✅ LICENSE file present"
            head -5 LICENSE
            echo "lic_file=LICENSE" >> "$GITHUB_ENV"
          elif [ -f LICENSE-MIT ]; then
            echo "✅ LICENSE-MIT file present"
            head -5 LICENSE-MIT
            echo "lic_file=LICENSE-MIT" >> "$GITHUB_ENV"
          elif [ -f LICENSE.md ]; then
            echo "✅ LICENSE.md file present"
            head -5 LICENSE.md
            echo "lic_file=LICENSE.md" >> "$GITHUB_ENV"
          elif [ -f LICENSE-Apache-2.0 ]; then
            echo "✅ LICENSE-Apache-2.0 file present"
            head -5 LICENSE-Apache-2.0
            echo "lic_file=LICENSE-Apache-2.0" >> "$GITHUB_ENV"
          elif [ -f LICENSE.txt ]; then
            echo "✅ LICENSE.txt file present"
            head -5 LICENSE.txt
            echo "lic_file=LICENSE.txt" >> "$GITHUB_ENV"
          else
            echo "❌ No LICENSE file found"
            exit 1
          fi

      - name: Check LICENSE is not boilerplate empty
        run: |
          line_count=$(wc -l < "$lic_file")
          if [ "$line_count" -lt 5 ]; then
            echo "❌ $lic_file appears too short ($line_count lines); may be a placeholder"
            exit 1
          fi
          echo "✅ $lic_file is substantive ($line_count lines)"

  # ── Job 4: CHANGELOG updated check ──────────────────────────────────
  changelog-check:
    name: CHANGELOG Update Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was modified
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base"..."$head" | grep -q "^CHANGELOG.md"; then
              echo "✅ CHANGELOG.md has been updated in this PR"
            else
              echo "❌ CHANGELOG.md has NOT been modified in this PR"
              echo "Please update CHANGELOG.md under [Unreleased] with your changes."
              exit 1
            fi
          else
            echo "⏭️ Skipping CHANGELOG check (not a PR event)"
          fi
