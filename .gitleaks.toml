# Phenotype-internal Gitleaks configuration
# Layer 2 #34 — gitleaks + trufflehog secret-scan workflow.
#
# Strategy:
#   1. Extend the official gitleaks default ruleset (so all upstream detectors
#      remain active).
#   2. Allow the phenotype-internal test secret literal
#      `PhenotypeTestToken123!` and other fixture-only patterns. These are
#      intentionally committed as test inputs and must never block CI.
#   3. Exclude common non-source paths (build artefacts, vendored deps,
#      lockfiles, session evidence files containing historical tokens) so
#      that they do not generate noise.
#   4. Prior config used `targetRules` to scope path exclusions to nine
#      named rules. That meant newer/uncatalogued rules (e.g. `private-key`
#      triggered by cargo's PKCS#8 docstring inside `target/debug/deps/*.rmeta`)
#      bypassed the `target/` path exclusion and produced false positives.
#      The 2026-10-05 Security Scan schedule failure (run 37303263760) and
#      Audit schedule failure (run 37302783988) both tripped on this.
#      Switched to global `paths` allowlists (rule-agnostic) so build artefacts
#      are excluded from every rule.

title = "Phenotype Gitleaks Config"

[extend]
useDefault = true

# 1. Path-based allowlist: skip noise paths and known test fixture dirs.
#    Global (no `targetRules`) so ALL rules honor the exclusion — fixes
#    the `private-key` false positive on cargo build artefacts.
[[allowlists]]
description = "Non-source / build artefact paths (rule-agnostic)"
paths = [
  '''(?i)\.git/''',
  '''(?i)target/''',
  '''(?i)node_modules/''',
  '''(?i)dist/''',
  '''(?i)build/''',
  '''(?i)vendor/''',
  '''(?i)\.venv/''',
  '''(?i)__pycache__/''',
  '''(?i)\.cargo/''',
  '''(?i)go\.sum$''',
  '''(?i)Cargo\.lock$''',
  '''(?i)package-lock\.json$''',
  '''(?i)pnpm-lock\.yaml$''',
  '''(?i)Pipfile\.lock$''',
  '''(?i)poetry\.lock$''',
  '''(?i)\.minisign/''',
  '''(?i)\.tuf/''',
  '''(?i)coverage/''',
  '''(?i)lcov\.info$''',
  # `.history/` was editor-snapshot cruft committed in three Aug 2024
  # commits (810ca7c5, 690ff958, 437e5138) and untracked later via
  # `git rm --cached -r .history/` (commit 8f7a12c6). Git history still
  # contains the file paths, so the scheduled full-history gitleaks scan
  # keeps finding 139 generic-api-key matches in those snapshots.
  # The snapshots are not source code and not load-bearing.
  '''(?i)\.history/''',
  '''(?i)tests?/.*/fixtures/''',
  '''(?i).*/testdata/''',
  '''(?i).*_test\.go$''',
  '''(?i).*\.test\.[a-z]+$''',
  '''(?i).*_test\.py$''',
  '''(?i).*\.spec\.[a-z]+$''',
]

# 2. Regex-based allowlist: known phenotype-internal test secrets.
[[allowlists]]
description = "Phenotype-internal test secret literals in test fixtures"
regexTarget = "match"
regexes = [
  '''PhenotypeTestToken123!''',
  '''PhenotypeInternalToken_?[A-Za-z0-9_]*''',
  '''phenotype-test-(token|key|secret)-[A-Za-z0-9_-]+''',
]

# 3. Regex-based allowlist scoped to test/fixture paths only.
[[allowlists]]
description = "Any test-secret-shaped literal under test fixture paths"
regexTarget = "match"
paths = [
  '''(?i)tests?/.*/fixtures/''',
  '''(?i).*/testdata/''',
  '''(?i).*\.test\.[a-z]+$''',
  '''(?i).*_test\.go$''',
  '''(?i).*_test\.py$''',
  '''(?i).*\.spec\.[a-z]+$''',
]
regexes = [
  '''(?i)(token|secret|key|password|apikey|api[_-]?key)\s*[:=]\s*['"]?[A-Za-z0-9_!@#$%^&*+=-]{8,}['"]?''',
]
stopwatch = false

# 4. Path allowlist: integration-evidence session file. Contains a
#    64-hex pilot-evidence token flagged as a known-unknown to the operator
#    in the handover doc §6 (rotation pending). The file is intentionally
#    committed as the audit trail for the 2026-09-14 integration run; the
#    token is human-visible there for traceability, and rotating the secret
#    is an operator-gated action tracked in the handover's "First actions"
#    list. Until rotated, exclude this single file from gitleaks to keep
#    the weekly cron green without losing the evidence.
[[allowlists]]
description = "Integration-evidence file with known-unknown token (rotation pending)"
paths = [
  '''(?i)docs/sessions/20260914-integration-evidence/INTEGRATION_EVIDENCE\.md$''',
]

# 5. Path allowlist: API_REFERENCE.md JWT example. The literal
#    `"token": "eyJhbGciOiJIUzI1NiIs..."` is a documentation placeholder,
#    not a real secret; the trailing `...` is the gitleaks fingerprint.
[[allowlists]]
description = "API_REFERENCE.md JWT placeholder literal"
regexTarget = "match"
paths = [
  '''(?i)API_REFERENCE\.md$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
]

# 6. Path allowlist: byteport-ghkey.pem. This private key was committed in
#    8ab442c2 and removed in 8f7a12c6 (the "hygiene" commit that also
#    rewrote the cargo-deny ignore list). Git history still references
#    the file path, so the full-history gitleaks scan keeps flagging it
#    on `private-key` (matched in the first line: `-----BEGIN PRIVATE KEY-----`).
#    The key was publicly exposed for ~17 months prior to removal; rotation
#    is the operator-gated action in handover §6. Until git history is
#    rewritten (or the repo is squashed), this allowlist keeps the weekly
#    cron green. Removing the file from git history via `git filter-repo`
#    is a destructive operation and not done here.
[[allowlists]]
description = "byteport-ghkey.pem (rotation pending, tracked in handover §6)"
paths = [
  '''(?i)backend/byteport/byteport-ghkey\.pem$''',
]

# 7. Path allowlist: session-extract worklog data files. These are
#    full transcript dumps of older assistant sessions committed to
#    `docs/worklogs/data/` (one per worklog). They are observational
#    data, not source code. The full-history gitleaks scan finds 80+
#    `generic-api-key` matches in them (assistant transcripts quote
#    user-supplied tokens). Allowlisting the entire `data/` subdir is
#    appropriate because the dir is exclusively worklog data.
[[allowlists]]
description = "Hexa-Kit worklog data files (observational, not source code)"
paths = [
  '''(?i)docs/worklogs/data/''',
]
