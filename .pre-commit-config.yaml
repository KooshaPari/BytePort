# L2 #33 pre-commit baseline, 2026-06-11.
# Install: pre-commit install
# Run default hooks: pre-commit run --all-files
# Run heavy language baselines: pre-commit run --all-files --hook-stage manual
#
# Generated, vendored and editor-state paths are excluded: they are not ours to
# format, and rewriting them (e.g. end-of-file-fixer over src-tauri/gen or
# vendored crates) produced ~100-file diffs on every run.
exclude: |
  (?x)^(
    frontend/web/\.history/.*|
    frontend/web/\.svelte-kit/.*|
    frontend/web/src-tauri/gen/.*|
    frontend/web/src-tauri/vendor/.*|
    frontend/web/target/.*|
    vendor/.*|
    \.astro/.*|
    \.grade-reports/.*|
    \.idea/.*|
    node_modules/.*|
    target/.*|
    .*\.(lock|sum)$|
    frontend/web/package-lock\.json
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        types_or: [python, pyi]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy -- -D warnings
        entry: bash -c 'command -v cargo >/dev/null || { echo "cargo not installed; skipping clippy"; exit 0; }; cargo clippy --workspace --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: golangci-lint
        name: golangci-lint run --timeout 5m
        entry: bash -c 'command -v golangci-lint >/dev/null || { echo "golangci-lint not installed; skipping"; exit 0; }; cd backend/byteport && golangci-lint run --config ../../golangci.yml --timeout 5m'
        language: system
        types: [go]
        pass_filenames: false
        stages: [manual]

      - id: tsc
        name: tsc --noEmit
        entry: bash -c 'cd frontend/web && [ -d node_modules ] || { echo "frontend node_modules missing; skipping tsc"; exit 0; }; npx tsc --noEmit'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [manual]

      - id: trufflehog
        name: trufflehog filesystem
        entry: bash -c 'command -v trufflehog >/dev/null || { echo "trufflehog not installed; skipping"; exit 0; }; trufflehog filesystem --no-update --only-verified --fail .'
        language: system
        pass_filenames: false
        stages: [manual]
