---
name: Trunk Code Quality setup
description: >-
  Install frontend dependencies and Trunk formatter plugins required by the
  repository quality checks.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend/web
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Install Trunk-managed tools
      shell: bash
      run: "${TRUNK_PATH:-trunk} tools install --ci"

    - name: Install Trunk Prettier plugins
      shell: bash
      working-directory: frontend/web
      run: |
        set -euo pipefail

        runner_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
        if [[ -z "${runner_home}" ]]; then
          runner_home="$(cd ~ && pwd)"
        fi
        prettier_modules=""
        for trunk_cache in \
          "${runner_home}/.cache/trunk" \
          "/home/runner/.cache/trunk"; do
          [[ -d "${trunk_cache}/tools/prettier" ]] || continue
          prettier_modules="$(
            find "${trunk_cache}/tools/prettier" \
              -type d -path '*/node_modules' -print -quit 2>/dev/null
          )"
          [[ -n "${prettier_modules}" ]] && break
        done
        if [[ -z "${prettier_modules}" ]]; then
          echo "::error::Trunk Prettier tool directory not found" >&2
          exit 1
        fi
        prettier_root="$(cd "${prettier_modules}/.." && pwd)"
        npm install \
          --prefix "${prettier_root}" \
          --no-save \
          --package-lock=false \
          --ignore-scripts \
          --no-audit \
          --no-fund \
          prettier-plugin-svelte@4.1.0 \
          prettier-plugin-tailwindcss@0.8.0
