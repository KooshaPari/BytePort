# Trunk.io code-quality configuration.
# Reference: https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.10.2

lint:
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy
    - eslint@8.10.0
    - gofmt@1.20.4
    - goimports@0.9.1
    - golangci-lint2@2.6.1
    - markdownlint@0.45.0
    - mypy@1.20.2
    - prettier@3.6.2
    - ruff@0.14.3
    - rustfmt
    - shellcheck@0.11.0
    - taplo@0.10.0
    - trufflehog@3.90.13
    - yamllint@1.37.1
  definitions:
    - name: black
      direct_configs:
        - pyproject.toml
    - name: golangci-lint2
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
        - golangci-lint.yaml
    - name: mypy
      direct_configs:
        - mypy.ini
        - setup.cfg
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - .prettierrc.json
        - .prettierrc.yml
        - prettier.config.js
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: rustfmt
      direct_configs:
        - rustfmt.toml
        - .rustfmt.toml

actions:
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available

tools:
  enabled:
    - jq@jq-1.7.1
    - yq@4.44.1
