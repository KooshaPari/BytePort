# Trunk.io code-quality configuration.
# Reference: https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.6.6
    - id: configs
      uri: https://github.com/trunk-io/configs
      ref: v1.2.1

lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - gofmt
    - goimports
    - golangci-lint
    - markdownlint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - trufflehog
    - yamllint
  definitions:
    - name: black
      direct_configs:
        - pyproject.toml
    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
        - golangci-lint.yaml
    - name: mypy
      direct_configs:
        - mypy.ini
        - setup.cfg
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - .prettierrc.json
        - .prettierrc.yml
        - prettier.config.js
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: rustfmt
      direct_configs:
        - rustfmt.toml
        - .rustfmt.toml

actions:
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available

tools:
  enabled:
    - jq@jq-1.7.1
    - yq@4.44.1
