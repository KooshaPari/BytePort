---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: f39f279b12a9f572e8af98d23d153524239928dc

# Trunk's current schema keeps all linters and formatters under lint.
lint:
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy
    - golangci-lint@1.64.8
    - mypy@1.20.2
    - prettier@3.6.2
    - ruff@0.14.3
    - rustfmt
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1
  definitions:
    - name: actionlint
      direct_configs:
        - .github/workflows/*.yml
    - name: black
      direct_configs:
        - pyproject.toml
        - ruff.toml
    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - prettier.config.*

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
