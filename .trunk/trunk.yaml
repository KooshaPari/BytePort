---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
      uri: https://github.com/trunk-io/plugins

# Trunk's current schema keeps all linters and formatters under lint.
lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
  definitions:
    - name: actionlint
      direct_configs:
        - .github/workflows/*.yml
    - name: black
      direct_configs:
        - pyproject.toml
        - ruff.toml
    - name: eslint
      direct_configs:
        - .eslintrc.*
        - eslint.config.*
    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - prettier.config.*

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
