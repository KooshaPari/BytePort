[workspace]
resolver = "3"
members = [
    "crates/byteport-transport",
    "crates/byteport-engine",
    "crates/byteport-cli",
    "crates/byteport-dag",
    "crates/byteport-otel",
    "crates/byteport-registry-adapter",
    "crates/phenotype-types",
    "crates/pheno-dag",
    "frontend/web/src-tauri",
    "ffi/macos-share",
    "ffi/android-companion",
    "ffi/linux-dbus",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.lints]
workspace = true

[workspace.metadata.lints]
clippy.pedantic = { level = "warn", priority = -1 }
