[workspace]
resolver = "3"
members = [
    "crates/byteport-transport",
    "crates/byteport-engine",
    "crates/byteport-cli",
    "crates/byteport-dag",
    "crates/byteport-otel",
    "crates/byteport-registry-adapter",
    "crates/phenotype-types",
    "crates/pheno-dag",
    "frontend/web/src-tauri",
    "ffi/macos-share",
    "ffi/android-companion",
    "ffi/linux-dbus",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.lints]
clippy.pedantic = { level = "warn", priority = -1 }

# ----------------------------------------------------------------------------
# WASM build target
# ----------------------------------------------------------------------------
# byteport-engine compiles to `wasm32-unknown-unknown` for browser/native-agent
# embedding (L122/L126/L130). The WASM bundle is published from CI and consumed
# by the Tauri web UI and any external agent runtimes.
#
# Build:   rustup target add wasm32-unknown-unknown
#          cargo build --target wasm32-unknown-unknown --release --target-dir target/wasm
# Test:    cargo test --target wasm32-unknown-unknown -p byteport-engine
# Bundle:  wasm-bindgen --target web --out-dir pkg target/wasm/wasm32-unknown-unknown/release/byteport_engine.wasm
#
# Crate-level opt-out: individual crates opt out of WASM via their own [target.'cfg(not(target_arch = "wasm32"))'.dependencies] blocks.
[profile.wasm]
inherits = "release"
opt-level = "z"        # size wins over speed for browser delivery
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
