# BytePort WASM Component Model — Standalone Policy Evaluator
#
# This is a self-contained WASM component that compiles to
# wasm32-unknown-unknown and evaluates JSON-based deployment policies.
# It does NOT depend on byteport-engine (which requires tokio/async std)
# — instead it implements a pure data-flow policy engine using only
# serde_json + std.
#
# Build:   cargo build --target wasm32-unknown-unknown --release
# Verify:  wasmtime wasm32-unknown-unknown.wasm
[workspace]

[package]
name = "byteport-wasm-policy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "evaluate_policy.rs"

[dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"       # Optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm]
component-model = true
default-stack-size = 1048576
