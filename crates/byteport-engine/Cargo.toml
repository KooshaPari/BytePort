[workspace]
resolver = "2"
members = ["."]

[package]
name = "byteport-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pluggable deployment-engine abstraction for BytePort (Phase 3A of byteport-evolution-v1)"
publish = false

[[bin]]
name = "byteport-engine-daemon"
path = "src/bin/daemon.rs"

[lib]
name = "byteport_engine"
path = "src/lib.rs"

[features]
default = ["nvms"]
nvms = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", optional = true, features = ["json"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
wiremock = "0.6"