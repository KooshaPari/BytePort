[package]
name = "byteport-transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# AWS SigV4 for presigned S3 PUT URLs.
#
# We deliberately use the lightweight `aws-sigv4` + `aws-credential-types`
# pair instead of the full `aws-sdk-s3` / `aws-config` crate pair: we only
# need to sign a single PutObject presigned request, the canonical-request
# construction is small and well-specified, and the full S3 SDK pulls
# hundreds of transitive crates that we do not use.
#
# - `aws-sigv4` provides the SigV4 canonical-request / string-to-sign /
#   signature pipeline plus a `SignatureLocation::QueryParams` mode that
#   returns the presigned URL query parameters.
# - `aws-credential-types` supplies the `Credentials` value type used to
#   build `SigningParams` without depending on the full SDK runtime.
#
# The `sign-http` feature (default) brings in `percent-encoding` and
# `form_urlencoded` which are needed to assemble the query string.
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"
# `aws-sigv4::sign::v4::SigningParams::identity()` requires an `&Identity`
# from `aws-smithy-runtime-api`, but it isn't re-exported. We need it
# as a direct dep so we can convert `Credentials` -> `Identity`.
aws-smithy-runtime-api = "1.19"
# `aws-sigv4` re-exports `http` under the `http1` feature, but the
# `apply_to_request_http1x` API requires the caller to construct an
# `http::Request` themselves, so we depend on `http` directly.
http = "1.1"

[dev-dependencies]
# Used by the LocalStack / MinIO integration test to PUT a 1-byte object
# to a real S3-compatible endpoint and assert the response status.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }