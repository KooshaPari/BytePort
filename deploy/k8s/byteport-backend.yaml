apiVersion: v1
kind: Namespace
metadata:
  name: byteport
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: byteport-config
  namespace: byteport
data:
  BYTEPORT_ENV: production
  BYTEPORT_LOG_LEVEL: info
  OMNIROUTE_DATA_PLANE_SOCKET: /run/omniroute/routed.sock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byteport-backend
  namespace: byteport
  labels:
    app.kubernetes.io/name: byteport
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: byteport
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byteport
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      serviceAccountName: byteport-backend
      containers:
        - name: gin
          image: ghcr.io/kooshapari/byteport-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: BYTEPORT_ENV
              valueFrom:
                configMapKeyRef:
                  name: byteport-config
                  key: BYTEPORT_ENV
            - name: BYTEPORT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: byteport-config
                  key: BYTEPORT_LOG_LEVEL
            - name: OMNIROUTE_DATA_PLANE_SOCKET
              valueFrom:
                configMapKeyRef:
                  name: byteport-config
                  key: OMNIROUTE_DATA_PLANE_SOCKET
            - name: BYTEPORT_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: byteport-db
                  key: dsn
            - name: BYTEPORT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: byteport-secrets
                  key: secret-key
          volumeMounts:
            - name: data-plane-socket
              mountPath: /run/omniroute
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data-plane-socket
          hostPath:
            path: /run/omniroute
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: byteport-backend
  namespace: byteport
  labels:
    app.kubernetes.io/name: byteport
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: byteport
    app.kubernetes.io/component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: byteport-backend
  namespace: byteport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: byteport-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
