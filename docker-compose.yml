# BytePort Docker Compose Stack
# Local development stack: API, MCP server, PostgreSQL, Redis, Prometheus, Grafana.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f api        # Tail API logs
#   docker compose down -v            # Tear down + remove volumes
#   docker compose --profile dev up   # Include dev-only services
#
# This stack is for LOCAL DEVELOPMENT ONLY. For production, see:
#   - .github/workflows/container-ci.yml  (CI image builds)
#   - .github/workflows/release.yml       (production releases)

version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Services
# ──────────────────────────────────────────────────────────────────────────────
services:
  # ─── Core API ─────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/byteport/backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
      args:
        VERSION: ${VERSION:-dev}
    container_name: byteport_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - DATABASE_URL=postgres://byteport:byteport@postgres:5432/byteport?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=byteport-dev-token
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=byteport-api
      - LOG_LEVEL=info
      - MCP_SERVER_URL=http://mcp:8181
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - byteport
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ─── MCP Server (Agent Interface) ────────────────────────────────────────
  mcp:
    image: ghcr.io/byteport/backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: mcp
      args:
        VERSION: ${VERSION:-dev}
    container_name: byteport_mcp
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      - BYTEPORT_API_URL=http://api:8080
      - BYTEPORT_LOG_LEVEL=info
    depends_on:
      - api
    networks:
      - byteport
    profiles: ["dev", "tools"]

  # ─── Redis (Cache + Sessions) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: byteport_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - byteport
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── PostgreSQL (Primary Store) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: byteport_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=byteport
      - POSTGRES_USER=byteport
      - POSTGRES_PASSWORD=byteport
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - byteport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteport -d byteport"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Vault (Secrets Management) ─────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.18
    container_name: byteport_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=byteport-dev-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_LOG_LEVEL=info
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    command: ["vault", "server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    networks:
      - byteport
    profiles: ["dev", "production"]

  # ─── OpenTelemetry Collector ────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: byteport_otel
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - byteport

  # ─── Prometheus (Metrics) ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: byteport_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - byteport
    profiles: ["dev", "production"]

  # ─── Grafana (Dashboards) ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: byteport_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - byteport
    profiles: ["dev", "production"]

# ──────────────────────────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ──────────────────────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────────────────────
networks:
  byteport:
    driver: bridge
    name: byteport_net
