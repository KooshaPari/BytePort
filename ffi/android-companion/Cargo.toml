[package]
name = "byteport-android-companion"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BytePort Android companion FFI: JNI bindings via ndk-context for byte hand-off from share-sheets. Scaffold only."
publish = false

[lib]
name = "byteport_android_companion"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.8"
ndk-context = "0.1"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
# No-op stubs for non-Android targets so `cargo check --workspace` works
# on linux/macOS CI before the cross-compile matrix is wired (see
# docs/ffi/MOBILE.md § Cross-compile matrix).

[dependencies]
thiserror = "2.0"

[features]
default = []