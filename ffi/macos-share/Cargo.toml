[package]
name = "byteport-macos-share"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BytePort macOS Share Extension FFI: NSItemProvider byte-routing via swift-rs. Scaffold only."
publish = false

[lib]
name = "byteport_macos_share"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

# swift-rs 0.1 is the Swift→Rust FFI compiler. The actual binding entry
# points (used inside build.rs) live in `swift_rs::build_utils`:
#   - `link_swift()` wires Swift runtime libraries.
#   - `link_swift_package(name, root)` invokes `swift build -c <profile>`
#     inside `root` (which must contain a `Package.swift`).
#
# Note: the OOP `SwiftLinker::new(...).with_package(...).link()` chain
# seen in many blog posts is from a newer swift-rs line. swift-rs 0.1
# (the line this scaffold pins to) uses the free-function API instead.
# See docs/ffi/SWIFT-RS.md for the API mismatch write-up.
#
# The build-dependencies table is also macOS-only so `cargo check
# --workspace` on Linux / Windows CI does not try to resolve the
# swift-rs crate from the registry at all.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = "1.0"

[dependencies]
thiserror = "2.0"

[features]
# Default: OFF. Scaffold compiles cross-platform without invoking
# `swift build`. Use `cargo build --features link-swift` on macOS to
# trigger the real Swift compile through swift-rs.
default = []
link-swift = []
