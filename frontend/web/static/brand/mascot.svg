<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BytePort mascot — a friendly portal cube">
  <title>Byte — BytePort mascot</title>
  <desc>An idle-breathing cube with a soft portal glow. Used in splash, empty states, and onboarding.</desc>
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--mascot-glow-inner, #7aa2ff)" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="var(--mascot-glow-mid, #5a7dff)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--mascot-glow-outer, #0b1020)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cube-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--mascot-face-top, #a4b8ff)"/>
      <stop offset="100%" stop-color="var(--mascot-face-bot, #5a7dff)"/>
    </linearGradient>
    <linearGradient id="cube-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--mascot-edge-top, #ffffff)" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="var(--mascot-edge-bot, #ffffff)" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#bg-glow)">
    <animate attributeName="r" values="118;126;118" dur="4.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4.2s" repeatCount="indefinite" />
  </circle>

  <g transform="translate(128 128)">
    <animateTransform attributeName="transform" type="translate" values="128 128; 128 124; 128 128" dur="4.2s" repeatCount="indefinite" additive="sum"/>

    <g transform="rotate(-12)">
      <polygon points="-46,-34 46,-34 60,0 46,34 -46,34 -60,0" fill="url(#cube-face)" stroke="url(#cube-edge)" stroke-width="2.5" stroke-linejoin="round"/>

      <g>
        <animate attributeName="opacity" values="0.0;0.0;1;1;0.0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="0" rx="3.5" ry="5" fill="#0b1020"/>
        <ellipse cx="18" cy="0" rx="3.5" ry="5" fill="#0b1020"/>
        <path d="M -14 16 Q 0 22 14 16" stroke="#0b1020" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

      <g>
        <animate attributeName="opacity" values="1;1;0.0;0.0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-2" rx="3.5" ry="5" fill="#0b1020"/>
        <path d="M -22 4 Q -18 8 -14 4" stroke="#0b1020" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M 14 4 Q 18 8 22 4" stroke="#0b1020" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <line x1="-18" y1="0" x2="-18" y2="-3" stroke="#0b1020" stroke-width="2"/>
      </g>

      <ellipse cx="0" cy="-2" rx="22" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.4"/>
    </g>
  </g>

  <g opacity="0.6">
    <circle cx="64" cy="64" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="192" cy="80" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="180" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="190" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>