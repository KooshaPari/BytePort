<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BytePort splash artwork">
  <title>BytePort Splash</title>
  <desc>Branded splash for the BytePort desktop application — mascot centered, soft portal glow, gradient mesh.</desc>
  <defs>
    <radialGradient id="bg-mesh" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="var(--splash-mesh-inner, #1c2756)"/>
      <stop offset="60%" stop-color="var(--splash-mesh-mid, #0f1430)"/>
      <stop offset="100%" stop-color="var(--splash-mesh-outer, #05080f)"/>
    </radialGradient>
    <linearGradient id="splash-grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="splash-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg-mesh)"/>

  <g opacity="0.4">
    <line x1="0" y1="512" x2="1024" y2="512" stroke="url(#splash-grid)" stroke-width="1"/>
    <line x1="0" y1="320" x2="1024" y2="320" stroke="url(#splash-grid)" stroke-width="1"/>
    <line x1="0" y1="704" x2="1024" y2="704" stroke="url(#splash-grid)" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="url(#splash-grid)" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="1024" stroke="url(#splash-grid)" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="url(#splash-grid)" stroke-width="1"/>
  </g>

  <circle cx="512" cy="512" r="380" fill="url(#splash-glow)">
    <animate attributeName="r" values="370;400;370" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(512 512)">
    <animateTransform attributeName="transform" type="translate" values="512 512; 512 504; 512 512" dur="4.5s" repeatCount="indefinite" additive="sum"/>

    <g transform="scale(2.4) rotate(-12)">
      <polygon points="-46,-34 46,-34 60,0 46,34 -46,34 -60,0" fill="#a4b8ff" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" stroke-linejoin="round"/>

      <g>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="0" rx="3.5" ry="5" fill="#0b1020"/>
        <ellipse cx="18" cy="0" rx="3.5" ry="5" fill="#0b1020"/>
        <path d="M -14 16 Q 0 22 14 16" stroke="#0b1020" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>

      <g>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-2" rx="3.5" ry="5" fill="#0b1020"/>
        <path d="M -22 4 Q -18 8 -14 4" stroke="#0b1020" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M 14 4 Q 18 8 22 4" stroke="#0b1020" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g transform="translate(512 800)">
    <text x="0" y="0" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="42" font-weight="700"
          fill="#ffffff" fill-opacity="0.95"
          letter-spacing="-0.5">
      BytePort
    </text>
    <text x="0" y="44" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="18" font-weight="400"
          fill="#ffffff" fill-opacity="0.55"
          letter-spacing="0.5">
      Self-hosted IaC + portfolio platform
    </text>
  </g>

  <g opacity="0.3">
    <circle cx="180" cy="220" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="280" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="780" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="820" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>