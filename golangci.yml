version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Standard set minus errcheck/staticcheck (legacy gate disabled both; kept off
  # here because golangci-lint v2 removed the --disable CLI flag).
  default: standard
  disable:
    - errcheck
    - staticcheck
  enable:
    - govet
    - ineffassign
    - unused
    - gosec
    - unconvert
    - unparam
    - gocritic
  settings:
    govet:
      enable-all: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
