[package]
name = "clap-ext"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/clap-ext"
authors = ["KooshaPari <kooshapari@kooshapari.com>"]
description = "Shared Rust CLI extension library: common subcommands, config flags, error display for clap-based CLIs"
keywords = ["cli", "clap", "argparse", "extension", "boilerplate"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }

# Vendored upstream source; dependency list is managed upstream.
[package.metadata.cargo-machete]
ignored = ["tracing"]
